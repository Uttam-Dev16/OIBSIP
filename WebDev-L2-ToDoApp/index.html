<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App | OIBSIP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-container">
        <section class="todo-app">
            <header class="app-header">
                <p class="eyebrow">OIBSIP • Level 2</p>
                <h1>My To-Do List</h1>
                <p class="subtitle">
                    Organize your tasks and keep track of your progress.
                </p>
            </header>

            <form class="task-form" id="taskForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a task..."
                    autocomplete="off"
                    maxlength="120"
                >
                <button type="submit" class="add-btn">Add Task</button>
            </form>

            <div class="task-summary">
                <span id="pendingCount">0 pending</span>
                <span id="completedCount">0 completed</span>
            </div>

            <section class="task-section">
                <h2>Pending Tasks</h2>
                <div id="pendingTasks" class="task-list">
                    <p class="empty-message" id="pendingEmpty">
                        No pending tasks. Add something to get started.
                    </p>
                </div>
            </section>

            <section class="task-section completed-section">
                <h2>Completed Tasks</h2>
                <div id="completedTasks" class="task-list">
                    <p class="empty-message" id="completedEmpty">
                        No completed tasks yet.
                    </p>
                </div>
            </section>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
