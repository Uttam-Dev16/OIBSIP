<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | OIBSIP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-header">
                <p class="eyebrow">OIBSIP • Level 2</p>
                <h1>Create Account</h1>
                <p>Register a new account to continue.</p>
            </div>

            <form id="registerForm" novalidate>

                <div class="form-group">
                    <label for="registerUsername">Username</label>
                    <input
                        type="text"
                        id="registerUsername"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                    <small class="error-message" id="usernameError"></small>
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                    <small class="error-message" id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Minimum 8 characters and 1 number"
                        autocomplete="new-password"
                        required
                    >
                    <small class="password-hint">
                        Use at least 8 characters with at least 1 number.
                    </small>
                    <small class="error-message" id="passwordError"></small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        required
                    >
                    <small class="error-message" id="confirmPasswordError"></small>
                </div>

                <p class="form-message" id="registerMessage"></p>

                <button type="submit" class="primary-btn">
                    Create Account
                </button>
            </form>

            <p class="switch-page">
                Already have an account?
                <a href="index.html">Login here</a>
            </p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
